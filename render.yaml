services:
  - type: web
    name: smart-courier
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
