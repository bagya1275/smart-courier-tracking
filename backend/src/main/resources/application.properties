spring.application.name=smart-courier-api
# Load a root .env during local development (optional). Environment variables still take precedence.
# Works whether Maven is started from the repository root or from backend/.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${PORT:8080}

# ===============================================
# MONGODB ATLAS
# ===============================================
# Set MONGODB_URI in the environment. Example:
# mongodb+srv://<username>:<password>@<cluster>.mongodb.net/smart_courier_db?retryWrites=true&w=majority&appName=SmartCourierCluster
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ===============================================
# JWT SECURITY
# ===============================================
# Generate a long random secret for production and set JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================================
# CORS
# ===============================================
# Comma-separated origins. Same-origin deployment does not require CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}

# Do not run SQL initialization; this application uses MongoDB.
spring.sql.init.mode=never

# Deployment health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Seed demo accounts/data on an empty database. Set false for a real production database.
app.seed.enabled=${SEED_DEMO_DATA:true}
